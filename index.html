<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 380px;
    }

    img {
      width: 230px;
      margin-bottom: 15px;
      border-radius: 15px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      margin-right: 10px;
    }

    #noBtn {
      background-color: #ddd;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- cute couple image -->
  <img src="https://pixabay.com/get/gdf027748dcc76f29a187caeebda64063dcf2950f2caaff102f41ad9f5f89a93c0ccab96d71dbd150deeeda650b70bc74_640.jpg" 
       alt="Happy Valentines Day Couple">

  <h1>Will you be my Valentine? 💖</h1>

  <button id="yesBtn" onclick="yesClicked()">Yes</button>
  <button id="noBtn" onclick="noClicked()">No</button>
</div>

<script>
  let noTexts = [
    "Are you sure? 😢",
    "Pleaseeee 🥺",
    "Think again 💭",
    "Don’t break my heart 💔",
    "I’ll be really sad 😭",
    "Pretty please 💕",
    "Minions are sad now 😟",
    "I brought chocolates 🍫",
    "I’ll share my fries 🍟",
    "Heart getting bigger 💗",
    "You’re my favorite 🥰",
    "Just say yes already 😩",
    "This heart is growing 💓",
    "I’ll keep trying 💛",
    "Give me one chance 🙏",
    "Still no? 🥲",
    "Come on now 😄",
    "You make my world 💞",
    "You and me forever? 💑",
    "Tap YES 💕"
  ];

  let count = 0;

  function noClicked() {
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    count++;
    yesBtn.style.fontSize = (18 + count * 4) + "px";
    noBtn.innerText = noTexts[count % noTexts.length];
  }

  function yesClicked() {
    document.body.innerHTML = `
      <div style="text-align:center;">
        <img src="https://pixabay.com/get/gdf027748dcc76f29a187caeebda64063dcf2950f2caaff102f41ad9f5f89a93c0ccab96d71dbd150deeeda650b70bc74_640.jpg"
             style="width:240px;border-radius:20px;">
        <h1 style="color:#ff4d6d;">YAYYYY 💕🥰</h1>
        <h2>You just made me the happiest 💛</h2>
        <h3>My Valentine forever ❤️</h3>
      </div>
    `;
  }
</script>

</body>
</html>
