<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 380px;
    }

    img {
      width: 230px;
      margin-bottom: 15px;
      border-radius: 18px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      margin-right: 10px;
    }

    #noBtn {
      background-color: #ddd;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Embedded image -->
  <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD..." alt="Cute Cat">

  <h1>Will you be my Valentine? 💖</h1>

  <button id="yesBtn" onclick="yesClicked()">Yes</button>
  <button id="noBtn" onclick="noClicked()">No</button>
</div>

<script>
  let noTexts = [
    "Are you sure? 😢",
    "Pleaseeee 🥺",
    "Think again 💭",
    "Don’t break my heart 💔",
    "Look how cute I am 😭",
    "I’ll be really sad 😿",
    "Pretty please 💕",
    "I promise cuddles 🤍",
    "You and me? 🥰",
    "My heart is growing 💗",
    "Just say yes 😩",
    "Okay now you’re teasing 😆",
    "One last try 😭",
    "Say yes already 💞"
  ];

  let count = 0;

  function noClicked() {
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    count++;
    yesBtn.style.fontSize = (18 + count * 4) + "px";
    noBtn.innerText = noTexts[count % noTexts.length];
  }

  function yesClicked() {
    document.body.innerHTML = `
      <div style="text-align:center;">
        <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD..." 
             style="width:240px;border-radius:20px;">
        <h1 style="color:#ff4d6d;">YAYYYY 💕🥰</h1>
        <h2>You just made me the happiest 💛</h2>
        <h3>My Valentine forever ❤️</h3>
      </div>
    `;
  }
</script>

</body>
</html>
